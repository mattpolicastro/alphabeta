<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>αlphaβeta lab — what can I detect with the traffic I have?</title>
<meta name="robots" content="noindex">
<style>body{margin:0;padding:24px;font:13px/1.7 'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;color:#8b939c;background:#f6f7f9}a{color:inherit}</style>
</head>
<body>
<p>Detectable lift is now a mode of <a id="to" href="/lab/sample-size/?v=2&amp;solve=mde">/lab/sample-size/</a> — one app, two unknowns of the same relation. Redirecting&hellip;</p>
<script>
  // Old detectable-lift schema (v,baseline,traffic,days,variants,tails,alpha,power)
  // mapped onto the merged canonical with solve=mde, so every URL shipped before
  // the merge still resolves to the same numbers. Bare visit → solve=mde defaults.
  var p = new URLSearchParams(location.search)
  var g = function(k, d){ var v = p.get(k); return v === null || v === '' || !isFinite(Number(v)) ? String(d) : String(Number(v)) }
  var q = 'v=2&solve=mde&baseline=' + g('baseline', 0.02) + '&traffic=' + g('traffic', 5000) +
          '&days=' + g('days', 14) + '&variants=' + g('variants', 2) +
          '&tails=' + (g('tails', 2) === '1' ? '1' : '2') +
          '&alpha=' + g('alpha', 0.05) + '&power=' + g('power', 0.8)
  document.getElementById('to').href = '/lab/sample-size/?' + q
  location.replace('/lab/sample-size/?' + q)
</script>
</body>
</html>
